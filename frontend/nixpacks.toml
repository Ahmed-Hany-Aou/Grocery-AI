[phases.setup]
nixPkgs = ["curl", "bash", "unzip"]

[phases.install]
cmds = [
  "curl -fsSL https://fnm.vercel.app/install | bash",
  "export PATH=\"$HOME/.fnm:$PATH\"",
  "fnm install 22.12.0",
  "fnm use 22.12.0",
  "rm -rf node_modules package-lock.json",
  "npm install"
]

[phases.build]
cmds = [
  "export PATH=\"$HOME/.fnm:$PATH\"",
  "fnm use 22.12.0",
  "npm run build"
]

[start]
cmd = "export PATH=\"$HOME/.fnm:$PATH\" && fnm use 22.12.0 && npx serve -s dist -l 3000"
