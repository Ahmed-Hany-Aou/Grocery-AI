[phases.setup]
nixPkgs = ["curl", "gnutar", "gzip"]

[phases.install]
cmds = [
  "mkdir -p /app/node-bin",
  "curl -fsSL https://nodejs.org/dist/v22.12.0/node-v22.12.0-linux-x64.tar.gz | tar -xz --strip-components=1 -C /app/node-bin",
  "bash -c 'export PATH=\"/app/node-bin/bin:$PATH\" && node -v && npm install'"
]

[phases.build]
cmds = [
  "bash -c 'export PATH=\"/app/node-bin/bin:$PATH\" && npm run build'"
]

[start]
cmd = "bash -c 'export PATH=\"/app/node-bin/bin:$PATH\" && npx serve -s dist -l 3000'"
