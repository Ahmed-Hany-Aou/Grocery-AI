[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_pgsql", "php83Packages.composer", "nodejs"]

[phases.install]
cmds = ["composer install --no-interaction --optimize-autoloader --no-dev"]

[phases.build]
cmds = ["echo 'Skipping frontend build'"]

[start]
cmd = "php artisan migrate --force && php artisan filament:upgrade && php artisan serve --host=0.0.0.0 --port=8080"
