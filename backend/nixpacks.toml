[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_pgsql", "php83Packages.composer", "nodejs"]

[phases.install]
cmds = ["composer install --no-interaction --optimize-autoloader --no-dev"]

[phases.build]
cmds = ["php artisan filament:upgrade", "php artisan storage:link", "chmod -R 777 storage bootstrap/cache"]

[start]
cmd = "([ -z \"$APP_KEY\" ] && php artisan key:generate --force); php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=8080"
